name: Build & release desktop apps

# Every push to main that touches the app builds the Apple Silicon bundle and the Windows
# installer/portable exe and publishes them as a
# GitHub Release tagged with APP_VERSION from app/stowplan.html (e.g. v95). Re-pushing the same
# version updates that release's asset in place.
on:
  push:
    branches: [main]
    paths: ['app/**', 'main.js', 'preload.js', 'package.json', 'build/icon.png', '.github/workflows/release.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Read APP_VERSION
        id: ver
        run: echo "tag=$(grep -o "APP_VERSION = 'v[0-9]*'" app/stowplan.html | grep -o 'v[0-9]*')" >> "$GITHUB_OUTPUT"
      - name: Build Apple Silicon app
        run: npx electron-builder --mac --arm64 --dir
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Package (tar, not zip — Archive Utility chokes on builder's zip)
        run: tar -czf StowPlan-AppleSilicon-Mac.tar.gz -C dist/mac-arm64 StowPlan.app
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: StowPlan ${{ steps.ver.outputs.tag }}
          files: StowPlan-AppleSilicon-Mac.tar.gz
          body: |
            Apple Silicon Mac build (tar.gz) and Windows x64 build (Setup installer + Portable exe). Unsigned: macOS may need right-click → Open, Windows SmartScreen may need "More info → Run anyway".

            ```
            cd ~/Downloads && curl -LO https://github.com/audiorazor/stowplan/releases/download/${{ steps.ver.outputs.tag }}/StowPlan-AppleSilicon-Mac.tar.gz
            tar -xzf StowPlan-AppleSilicon-Mac.tar.gz && rm -rf /Applications/StowPlan.app && mv StowPlan.app /Applications/
            xattr -cr /Applications/StowPlan.app && open /Applications/StowPlan.app
            ```

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Read APP_VERSION
        id: ver
        shell: bash
        run: echo "tag=$(grep -o "APP_VERSION = 'v[0-9]*'" app/stowplan.html | grep -o 'v[0-9]*')" >> "$GITHUB_OUTPUT"
      - name: Allow symlinks (electron-builder's winCodeSign bundle needs Developer Mode)
        run: reg add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock" /t REG_DWORD /f /v AllowDevelopmentWithoutDevLicense /d 1
      - name: Build Windows installer + portable exe
        shell: bash
        run: npx electron-builder --win --x64 --publish never 2>&1 | tee build-log.txt; test ${PIPESTATUS[0]} -eq 0
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Keep the log where it can be read (on failure)
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          files: build-log.txt
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: StowPlan ${{ steps.ver.outputs.tag }}
          files: |
            dist/StowPlan-Setup-Windows.exe
            dist/StowPlan-Portable-Windows.exe
